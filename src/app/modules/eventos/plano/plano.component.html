<div class="plano-container" tabindex="0">

  <!-- Header con toolbar -->
  <div class="page-header">
    <div class="header-content">
      <div class="page-title">
        <mat-icon class="page-icon">map</mat-icon>
        <h1>Diseñador de Planos</h1>
      </div>
      <p class="page-description">Organiza visualmente los elementos de tu evento</p>
    </div>

    <div class="header-actions">
      <mat-form-field appearance="outline" class="plantilla-select">
        <mat-label>Plantilla del lugar</mat-label>
        <mat-select [(value)]="plantillaSeleccionada" (selectionChange)="seleccionarPlantilla($event.value)">
          <mat-option *ngFor="let plantilla of plantillasDisponibles" [value]="plantilla">
            {{ plantilla.nombre }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-raised-button color="warn" (click)="nuevoDiseno()" matTooltip="Limpiar área de trabajo">
        <mat-icon>clear_all</mat-icon>
        Nuevo Diseño
      </button>

      <button mat-raised-button color="accent" (click)="abrirSelectorArchivo()" matTooltip="Importar diseño desde JSON">
        <mat-icon>upload_file</mat-icon>
        Cargar Plano
      </button>

      <button mat-raised-button color="primary" (click)="guardarDiseno()" matTooltip="Exportar diseño en JSON">
        <mat-icon>save</mat-icon>
        Guardar Diseño
      </button>

      <!-- Input file oculto para cargar JSON -->
      <input #fileInput type="file" accept=".json" (change)="cargarPlanoDesdeArchivo($event)" style="display: none;">
    </div>
  </div>

  <!-- Componente Plano View -->
  <div class="plano-view-container">
    <app-plano-view
      [elements]="elementosEnCanvas"
      [plantillaNombre]="plantillaSeleccionada?.nombre"
      [showSidebar]="true">
    </app-plano-view>
  </div>

</div>
